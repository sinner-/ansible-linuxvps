---
caddy_default_client_max_body_size: 32KB
caddy_max_request_header_size: 3KB
caddy_request_timeout: 10s
caddy_idle_timeout: 10s
caddy_tls_min_version: tls1.2
caddy_tls_max_version: tls1.3
caddy_tls_key_type: p256
caddy_tls_curves:
  - x25519
  - secp256r1
caddy_tls12_ciphers:
  - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

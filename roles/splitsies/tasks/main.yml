---
- name: Install Splitsies
  ansible.builtin.dnf:
    name:
      - splitsies
      - splitsies-selinux
    state: present
  register: splitsies_packages

- name: Deploy Splitsies configuration
  ansible.builtin.template:
    src: splitsies.env.j2
    dest: /etc/splitsies/splitsies.env
    owner: root
    group: root
    mode: '0600'
  register: splitsies_config

- name: Check whether the Splitsies socket unit is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/splitsies.socket
  register: splitsies_socket_unit

- name: Reload systemd after a Splitsies package change
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: splitsies_packages.changed

- name: Restart Splitsies after package or configuration changes
  ansible.builtin.systemd_service:
    name: splitsies
    state: restarted
  when: splitsies_packages.changed or splitsies_config.changed

- name: Enable and start the Splitsies socket
  ansible.builtin.systemd_service:
    name: splitsies.socket
    enabled: true
    state: started
  when: not ansible_check_mode or splitsies_socket_unit.stat.exists

- name: Enable and start Splitsies
  ansible.builtin.systemd_service:
    name: splitsies
    enabled: true
    state: started
